# missioncrea.clippingatlas.com — proxied to the Node app on 127.0.0.1:3500
# name-based (NOT default_server) so it never interferes with the other vhosts.

server {
    listen 80;
    server_name missioncrea.clippingatlas.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 91.134.141.72:443 ssl;
    server_name missioncrea.clippingatlas.com;

    ssl_certificate     /etc/letsencrypt/live/missioncrea.clippingatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/missioncrea.clippingatlas.com/privkey.pem;

    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;

    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
